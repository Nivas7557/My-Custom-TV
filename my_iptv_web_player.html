<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100 select-none">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shree - Next-Gen IPTV & TV App</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- HLS.js CDN -->
    <script src="https://jsdelivr.net"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f3ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            accent: '#06b6d4',
                            pink: '#ec4899',
                            glow: '#3b82f6'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(51, 65, 85, 0.7);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(99, 102, 241, 0.9);
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .glass-card:hover {
            background: rgba(30, 41, 59, 0.8);
            border-color: rgba(99, 102, 241, 0.5);
            box-shadow: 0 0 25px -5px rgba(99, 102, 241, 0.35);
            transform: translateY(-2px);
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.9; }
            50% { transform: scale(1.15); opacity: 0.4; }
            100% { transform: scale(0.95); opacity: 0.9; }
        }
        .live-dot {
            animation: pulse-ring 2s infinite ease-in-out;
        }

        .view-section {
            display: none;
        }
        .view-section.active {
            display: flex;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Android TV Remote Focus & Leanback Layout Styles */
        body.tv-mode-active {
            font-size: 115%;
            background: #020617;
        }
        body.tv-mode-active #mainSidebar {
            width: 80px;
        }
        body.tv-mode-active #mainSidebar .nav-item span,
        body.tv-mode-active #mainSidebar .text-[10px],
        body.tv-mode-active #mainSidebar .truncate {
            display: none;
        }
        body.tv-mode-active #mainSidebar .nav-item {
            justify-content: center;
            padding: 1rem;
        }

        .tv-focused {
            outline: 4px solid #6366f1 !important;
            outline-offset: 3px !important;
            background-color: rgba(99, 102, 241, 0.35) !important;
            transform: scale(1.04) !important;
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.7) !important;
            z-index: 30;
        }
    </style>
</head>
<body class="h-full flex flex-col font-sans bg-slate-950 text-slate-100 overflow-hidden antialiased">

    <!-- Top App Navigation Header -->
    <header class="h-16 glass-panel z-40 flex items-center justify-between px-4 lg:px-6 shrink-0 border-b border-slate-800/85">
        <div class="flex items-center space-x-4">
            <button id="mobileSidebarToggle" class="lg:hidden text-slate-400 hover:text-white p-2 rounded-xl hover:bg-slate-800 transition">
                <i data-lucide="menu" class="w-6 h-6"></i>
            </button>
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 via-brand-accent to-brand-pink p-0.5 shadow-lg shadow-indigo-500/20 flex items-center justify-center">
                    <div class="w-full h-full bg-slate-950 rounded-[10px] flex items-center justify-center">
                        <i data-lucide="tv-remote" class="w-5 h-5 text-brand-accent"></i>
                    </div>
                </div>
                <div>
                    <div class="flex items-center space-x-2">
                        <h1 class="text-base font-extrabold tracking-wide bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent leading-none">
                            STREAMVUE <span class="text-brand-accent">MAX</span>
                        </h1>
                        <span id="appModeBadge" class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-brand-600/30 text-brand-accent border border-brand-accent/30 tracking-wider">WEB MODE</span>
                    </div>
                    <p class="text-[10px] text-slate-400 font-medium tracking-wide mt-0.5 flex items-center space-x-1.5">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 live-dot"></span>
                        <span id="headerStatusText">Engine Ready</span>
                    </p>
                </div>
            </div>
        </div>

        <div class="hidden md:flex items-center flex-1 max-w-md mx-8 relative">
            <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="text" id="globalSearchInput" placeholder="Search Channels, Movies, Categories..." 
                class="w-full pl-10 pr-10 py-2 bg-slate-900/90 border border-slate-800 rounded-xl text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition">
        </div>

        <div class="flex items-center space-x-3">
            <button id="toggleAppModeBtn" class="px-3.5 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 rounded-xl text-xs font-semibold select-none flex items-center space-x-2">
                <i data-lucide="monitor" class="w-4 h-4"></i>
                <span>Switch Mode</span>
            </button>
            <button class="p-2 bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 rounded-xl transition relative">
                <i data-lucide="bell" class="w-4 h-4"></i>
                <span class="absolute top-2 right-2 w-1.5 h-1.5 bg-brand-pink rounded-full"></span>
            </button>
        </div>
    </header>

    <!-- Main Container Interface Shell -->
    <div class="flex-1 flex overflow-hidden relative">
        
        <!-- Left Side Navigation Bar -->
        <aside id="mainSidebar" class="hidden lg:flex flex-col w-64 glass-panel shrink-0 border-r border-slate-800/85 transition-all duration-300 z-30 justify-between py-4">
            <div class="space-y-6 px-3">
                <div class="space-y-1">
                    <p class="px-3 text-[10px] font-bold text-slate-500 uppercase tracking-widest">Navigation</p>
                    <button class="nav-item flex items-center space-x-3 w-full px-3 py-2.5 rounded-xl bg-gradient-to-r from-brand-600/20 to-transparent border border-brand-500/20 text-white font-semibold text-xs transition">
                        <i data-lucide="layout-dashboard" class="w-4 h-4 text-brand-accent"></i>
                        <span>Dashboard Home</span>
                    </button>
                    <button class="nav-item flex items-center space-x-3 w-full px-3 py-2.5 rounded-xl text-slate-400 hover:text-white hover:bg-slate-900/60 font-medium text-xs transition">
                        <i data-lucide="tv" class="w-4 h-4"></i>
                        <span>Live TV Streams</span>
                        <span id="badgeLiveCount" class="ml-auto text-[10px] px-2 py-0.5 rounded-md bg-slate-800 text-slate-400 font-bold border border-slate-700/60">74</span>
                    </button>
                    <button class="nav-item flex items-center space-x-3 w-full px-3 py-2.5 rounded-xl text-slate-400 hover:text-white hover:bg-slate-900/60 font-medium text-xs transition">
                        <i data-lucide="clapperboard" class="w-4 h-4"></i>
                        <span>Movies (VOD)</span>
                    </button>
                    <button class="nav-item flex items-center space-x-3 w-full px-3 py-2.5 rounded-xl text-slate-400 hover:text-white hover:bg-slate-900/60 font-medium text-xs transition">
                        <i data-lucide="film" class="w-4 h-4"></i>
                        <span>TV Series</span>
                    </button>
                    <button class="nav-item flex items-center space-x-3 w-full px-3 py-2.5 rounded-xl text-slate-400 hover:text-white hover:bg-slate-900/60 font-medium text-xs transition">
                        <i data-lucide="heart" class="w-4 h-4"></i>
                        <span>Favorites</span>
