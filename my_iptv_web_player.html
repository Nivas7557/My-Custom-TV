<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100 select-none">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shree - Next-Gen IPTV & TV App</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- HLS.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f3ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            accent: '#06b6d4',
                            pink: '#ec4899',
                            glow: '#3b82f6'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(51, 65, 85, 0.7);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(99, 102, 241, 0.9);
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .glass-card:hover {
            background: rgba(30, 41, 59, 0.8);
            border-color: rgba(99, 102, 241, 0.5);
            box-shadow: 0 0 25px -5px rgba(99, 102, 241, 0.35);
            transform: translateY(-2px);
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.9; }
            50% { transform: scale(1.15); opacity: 0.4; }
            100% { transform: scale(0.95); opacity: 0.9; }
        }
        .live-dot {
            animation: pulse-ring 2s infinite ease-in-out;
        }

        .view-section {
            display: none;
        }
        .view-section.active {
            display: flex;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Mini-player */
        .video-mini-player {
            position: fixed !important;
            z-index: 60 !important;
            width: 30vw !important;
            height: 40vh !important;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9), 0 0 30px rgba(99, 102, 241, 0.5) !important;
            border-color: rgba(99, 102, 241, 0.9) !important;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1) !important;
            cursor: pointer;
        }

        .video-mini-player.pos-top-right { top: 1rem !important; right: 1rem !important; }
        .video-mini-player.pos-top-left { top: 1rem !important; left: 1rem !important; }
        .video-mini-player.pos-bottom-right { bottom: 1rem !important; right: 1rem !important; }
        .video-mini-player.pos-bottom-left { bottom: 1rem !important; left: 1rem !important; }

        .video-mini-player .absolute.inset-x-0,
        .video-mini-player .absolute.top-3 { display: none !important; }
        .preview-label-tag { display: none; }
        .video-mini-player .preview-label-tag { display: flex !important; }

        /* Android TV Remote Focus & Leanback Layout Styles */
        body.tv-mode-active {
            font-size: 115%;
            background: #020617;
        }
        body.tv-mode-active #mainSidebar {
            width: 80px;
        }
        body.tv-mode-active #mainSidebar .nav-item span,
        body.tv-mode-active #mainSidebar .text-[10px],
        body.tv-mode-active #mainSidebar .truncate {
            display: none;
        }
        body.tv-mode-active #mainSidebar .nav-item {
            justify-content: center;
            padding: 1rem;
        }

        .tv-focused {
            outline: 4px solid #6366f1 !important;
            outline-offset: 3px !important;
            background-color: rgba(99, 102, 241, 0.35) !important;
            transform: scale(1.04) !important;
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.7) !important;
            z-index: 30;
        }
    </style>
</head>
<body class="h-full flex flex-col font-sans bg-slate-950 text-slate-100 overflow-hidden antialiased">

    <!-- Top App Navigation Header -->
    <header class="h-16 glass-panel z-40 flex items-center justify-between px-4 lg:px-6 shrink-0 border-b border-slate-800/85">
        <div class="flex items-center space-x-4">
            <button id="mobileSidebarToggle" class="lg:hidden text-slate-400 hover:text-white p-2 rounded-xl hover:bg-slate-800 transition">
                <i data-lucide="menu" class="w-6 h-6"></i>
            </button>
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 via-brand-accent to-brand-pink p-0.5 shadow-lg shadow-indigo-500/20 flex items-center justify-center">
                    <div class="w-full h-full bg-slate-950 rounded-[10px] flex items-center justify-center">
                        <i data-lucide="tv-remote" class="w-5 h-5 text-brand-accent"></i>
                    </div>
                </div>
                <div>
                    <div class="flex items-center space-x-2">
                        <h1 class="text-base font-extrabold tracking-wide bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent leading-none">
                            STREAMVUE <span class="text-brand-accent">MAX</span>
                        </h1>
                        <span id="appModeBadge" class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-brand-600/30 text-brand-accent border border-brand-accent/30 tracking-wider">WEB MODE</span>
                    </div>
                    <p class="text-[10px] text-slate-400 font-medium tracking-wide mt-0.5 flex items-center space-x-1.5">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 live-dot"></span>
                        <span id="headerStatusText">Engine Ready</span>
                    </p>
                </div>
            </div>
        </div>

        <div class="hidden md:flex items-center flex-1 max-w-md mx-8 relative">
            <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="text" id="globalSearchInput" placeholder="Search Channels, Movies, Categories..." 
                class="w-full pl-10 pr-10 py-2 bg-slate-900/90 border border-slate-800 rounded-xl text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition">
        </div>

        <div class="flex items-center space-x-3">
            <button id="toggleAppModeBtn" class="px-3.5 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 rounded-xl text-xs font-semibold select-none flex items-center space-x-2">
                <i data-lucide="monitor" class="w-4 h-4"></i>
                <span>Switch Mode</span>
            </button>
        </div>
    </header>

    <main class="flex-1 flex overflow-hidden">
        <!-- Dashboard Content Area -->
        <div id="mainContent" class="flex-1 overflow-y-auto px-4 py-6 lg:px-8">
            <div id="dashboardSection" class="view-section active flex-col space-y-6">
                <!-- Status Row -->
                <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                    <div class="glass-card p-4 rounded-2xl flex items-center space-x-4">
                        <div class="p-3 bg-brand-500/10 rounded-xl text-brand-500">
                            <i data-lucide="tv" class="w-6 h-6"></i>
                        </div>
                        <div>
                            <p class="text-sm font-bold text-slate-400">Channels</p>
                            <h3 id="dashChannelsCount" class="text-xl font-black">0</h3>
                        </div>
                    </div>
                </div>

                <!-- Playlist Input Block -->
                <div class="glass-panel p-6 rounded-2xl space-y-4">
                    <h2 class="text-lg font-bold flex items-center space-x-2">
                        <i data-lucide="list-music" class="text-brand-accent w-5 h-5"></i>
                        <span>M3U Playlist Source Manager</span>
                    </h2>
                    <div class="flex flex-col md:flex-row space-y-3 md:space-y-0 md:space-x-3">
                        <input type="text" id="playlistUrlInput" placeholder="Paste raw M3U / M3U8 URL here..."
