name: Auto Update Normalized Channels

on:
  schedule:
    # Runs automatically every 6 hours
    - cron: '30 */6 * * *'
  workflow_dispatch: # Allows manual trigger button

permissions:
  contents: write

jobs:
  normalize-playlist:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        pip install requests

    - name: Run normalization script
      run: python normalize_playlist.py

    - name: Commit and Push changes
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "actions@github.com"
        git add "Normalized Channels.m3u"
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-updated normalized channels playlist" && git push)
